; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-bill

[env:esp32-bill]
platform = espressif32@7.0.1
board = lolin32
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = time
lib_extra_dirs = lib
lib_ignore = TftBillDisplay
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_014BCF94-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_014BCF94-if00-port0
build_src_filter =
	+<*>
	-<oled_test.cpp>
	-<ttgo_lora32_test.cpp>
	-<ttgo_oled_reference.cpp>
	-<ttgo_oled_raw.cpp>
	-<ttgo_oled_final.cpp>
	-<ttgo_oled_i2c_test.cpp>
	-<ttgo_touch_test.cpp>
	-<tap_rssi_test.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	-I include
	-Os
	-Wall
	-Wextra

[env:oled-test]
platform = espressif32@7.0.1
board = lolin32
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = time
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_014BCF94-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2104_USB_to_UART_Bridge_Controller_014BCF94-if00-port0
build_src_filter =
	-<*>
	+<oled_test.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	-I include
	-Os
	-Wall
	-Wextra

[env:ttgo-lora32-test]
platform = espressif32@7.0.1
board = ttgo-lora32-v1
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = time
lib_extra_dirs = lib
lib_ignore = TftBillDisplay
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
build_src_filter =
	-<*>
	+<ttgo_lora32_test.cpp>
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	-I include
	-D RGB_BILL_TTGO_LORA32_V13=1
	-Os
	-Wall
	-Wextra

[env:ttgo-lora32-oled21-test]
extends = env:ttgo-lora32-test
build_flags =
	${env:ttgo-lora32-test.build_flags}
	-D RGB_BILL_TTGO_OLED_21_22=1
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.17
	bodmer/TFT_eSPI@^2.5.43

[env:ttgo-lora32-oled-test]
extends = env:ttgo-lora32-test
lib_ignore = TftBillDisplay
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit SSD1306@^2.5.17
build_flags =
	${env:ttgo-lora32-test.build_flags}
	-D RGB_BILL_TTGO_EXTERNAL_OLED=1

[env:ttgo-lora32-tft-legacy]
extends = env:ttgo-lora32-test
lib_ignore = BillDisplay
lib_deps =
	adafruit/Adafruit GFX Library@1.12.6
	adafruit/Adafruit ILI9341@^1.6.2
build_flags =
	${env:ttgo-lora32-test.build_flags}
	-D RGB_BILL_TTGO_TFT_ILI9341=1

[env:ttgo-touch-test]
platform = espressif32@7.0.1
board = ttgo-lora32-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
build_src_filter =
	-<*>
	+<ttgo_touch_test.cpp>
build_flags =
	-Os
	-Wall
	-Wextra

[env:wemos-tap-rssi-test]
