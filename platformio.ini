[env:waveshare-s3-basic-test]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = large_littlefs_32MB.csv
board_upload.flash_size = 32MB
monitor_speed = 115200
monitor_filters = time
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:90:CC:04-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:90:CC:04-if00
build_src_filter =
	-<*>
	+<waveshare_s3_basic_test.cpp>
lib_deps =
	moononournation/GFX Library for Arduino@1.6.0
	lewisxhe/SensorLib@0.3.1
build_flags =
	-I include
	-D FORK2CHECKBOOK_WAVESHARE_BASIC_TEST=1
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-Os
	-Wall
	-Wextra

[env:waveshare-s3-bill]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
